<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Archivo:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --field: #0d2a2d;
    --field-deep: #071a1c;
    --brass: #c9a227;
    --patina: #7fa8a3;
    --paper: #ece5d5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--field-deep);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vmin 5vmin;
    background:
      radial-gradient(120% 90% at 50% 18%, var(--field) 0%, var(--field-deep) 78%);
    color: var(--paper);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .plate {
    width: 100%;
    max-width: 60rem;
    -webkit-user-select: none;
    user-select: none;
    opacity: 0;
    transform: translateY(0.6rem);
    animation: settle 900ms cubic-bezier(.2, .7, .3, 1) 120ms forwards;
  }

  @keyframes settle {
    to { opacity: 1; transform: none; }
  }

  .readout {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(0.6rem, 2.4vw, 1.8rem);
    flex-wrap: wrap;
  }

  .group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
  }

  .num {
    font-family: "Bodoni Moda", "Didot", "Playfair Display", Georgia, serif;
    font-weight: 500;
    font-size: clamp(3.4rem, 13.5vw, 8.5rem);
    line-height: 0.82;
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums lining-nums;
    min-width: 2ch;
    text-align: center;
    color: var(--paper);
  }

  .unit {
    font-size: clamp(0.7rem, 1.5vw, 0.82rem);
    font-weight: 400;
    letter-spacing: 0.09em;
    color: var(--patina);
  }

  .sep {
    align-self: stretch;
    width: 1px;
    margin-top: 0.35rem;
    background: linear-gradient(
      to bottom,
      rgba(201, 162, 39, 0) 0%,
      rgba(201, 162, 39, 0.55) 22%,
      rgba(201, 162, 39, 0.55) 62%,
      rgba(201, 162, 39, 0) 100%
    );
    height: clamp(3.4rem, 13.5vw, 8.5rem);
  }

  .live .num { transition: opacity 160ms linear; }
  .live.dim .num { opacity: 0.82; }

  .rule {
    height: 1px;
    margin: clamp(2.2rem, 6vw, 3.4rem) auto clamp(1.1rem, 2.6vw, 1.6rem);
    max-width: 34rem;
    background: linear-gradient(
      to right,
      rgba(201, 162, 39, 0) 0%,
      rgba(201, 162, 39, 0.5) 30%,
      rgba(201, 162, 39, 0.5) 70%,
      rgba(201, 162, 39, 0) 100%
    );
  }

  .inscription {
    margin: 0 auto;
    max-width: 34rem;
    text-align: center;
    font-family: "Bodoni Moda", Georgia, serif;
    font-style: italic;
    font-size: clamp(0.98rem, 2.4vw, 1.2rem);
    line-height: 1.55;
    color: rgba(236, 229, 213, 0.72);
    text-wrap: balance;
  }

  .inscription .stamp { color: var(--brass); font-style: normal; }

  @media (prefers-reduced-motion: reduce) {
    .plate { animation: none; opacity: 1; transform: none; }
    .live .num { transition: none; }
    .live.dim .num { opacity: 1; }
  }

  @media (max-width: 30rem) {
    .readout { gap: 0.5rem; }
    .sep { height: clamp(2.8rem, 12vw, 4rem); }
  }
</style>

<div class="plate">
  <div class="readout" id="readout" role="timer" aria-label="Time elapsed">
    <div class="group"><span class="num" id="d">0</span><span class="unit">days</span></div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group"><span class="num" id="h">00</span><span class="unit">hours</span></div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group"><span class="num" id="m">00</span><span class="unit">minutes</span></div>
    <span class="sep" aria-hidden="true"></span>
    <div class="group live" id="live"><span class="num" id="s">00</span><span class="unit">seconds</span></div>
  </div>

  <div class="rule"></div>
  <p class="inscription" id="since">Finding the start&nbsp;time.</p>
</div>

<script>
(function () {
  "use strict";

  var KEY = "count-up-origin";
  var BAKED = 1788925636000; // set when this page was made, used only if nothing can be stored

  var elD = document.getElementById("d");
  var elH = document.getElementById("h");
  var elM = document.getElementById("m");
  var elS = document.getElementById("s");
  var elLive = document.getElementById("live");
  var elSince = document.getElementById("since");
  var elReadout = document.getElementById("readout");

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  // Read the origin once. If none is stored, write this moment and never touch it again.
  async function resolveOrigin() {
    var store = window.storage;
    if (!store || typeof store.get !== "function") return BAKED;

    try {
      var found = await store.get(KEY);
      var parsed = found && Number(found.value);
      if (parsed && isFinite(parsed) && parsed > 0) return parsed;
    } catch (e) {
      // no value yet
    }

    var now = Date.now();
    try {
      await store.set(KEY, String(now));
    } catch (e) {
      // couldn't persist; the tab still counts from now
    }
    return now;
  }

  function inscribe(origin) {
    var when = new Date(origin);
    var day = when.toLocaleDateString(undefined, {
      day: "numeric", month: "long", year: "numeric"
    });
    var clock = when.toLocaleTimeString(undefined, {
      hour: "numeric", minute: "2-digit"
    });
    elSince.innerHTML = "Running without interruption since " +
      '<span class="stamp">' + clock + "</span> on " +
      '<span class="stamp">' + day + "</span>.";
  }

  function start(origin) {
    Object.freeze(origin);
    inscribe(origin);

    var lastSecond = -1;

    function paint() {
      var elapsed = Date.now() - origin;
      if (elapsed < 0) elapsed = 0; // a changed system clock can't wind this back

      var total = Math.floor(elapsed / 1000);
      var s = total % 60;
      var m = Math.floor(total / 60) % 60;
      var h = Math.floor(total / 3600) % 24;
      var d = Math.floor(total / 86400);

      if (s === lastSecond) return;
      lastSecond = s;

      elD.textContent = String(d);
      elH.textContent = pad(h);
      elM.textContent = pad(m);
      elS.textContent = pad(s);

      elReadout.setAttribute(
        "aria-label",
        d + " days, " + h + " hours, " + m + " minutes elapsed"
      );

      elLive.classList.add("dim");
      setTimeout(function () { elLive.classList.remove("dim"); }, 140);
    }

    paint();
    setInterval(paint, 250);
    document.addEventListener("visibilitychange", paint);
    window.addEventListener("focus", paint);
  }

  resolveOrigin().then(start).catch(function () { start(BAKED); });
})();
</script>
